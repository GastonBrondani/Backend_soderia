services:
  test-db:
    image: postgres:17
    container_name: soderia_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: soderia_test
      TZ: America/Argentina/Cordoba
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d soderia_test"]
      interval: 5s
      timeout: 5s
      retries: 10
